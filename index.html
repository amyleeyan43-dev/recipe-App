<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>今天吃啥</title>
<meta name="theme-color" content="#2E7D32">
<meta name="description" content="家常菜谱：按食材找菜、看做法视频、规划一周三餐">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="今天吃啥">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="app-header">
  <div class="logo-row">
    <img class="logo-img" src="icons/icon-192.png" alt="今天吃啥" onerror="this.style.display='none'">
    <h1>今天吃啥</h1>
  </div>
  <p class="slogan">冰箱里有什么，就做什么😋</p>
</header>

<main class="app-main">

  <!-- ===== 灵感（首页） ===== -->
  <section id="tab-home" class="tab-page active">
    <div class="search-row">
      <input id="searchInput" type="search" placeholder="搜菜名、食材、口味…" maxlength="30">
    </div>
    <div class="filter-row" id="mealFilters">
      <button class="chip active" data-f="all">全部</button>
      <button class="chip" data-f="早餐">早餐</button>
      <button class="chip" data-f="午餐">午餐</button>
      <button class="chip" data-f="晚餐">晚餐</button>
    </div>
    <p class="hint" id="homeHint"></p>
    <div id="homeList"></div>
  </section>

  <!-- ===== 食材 ===== -->
  <section id="tab-ingredients" class="tab-page">
    <div class="page-head">
      <h2>🧺 我家有啥</h2>
      <p class="hint">勾选你现在手头的食材，然后点「生成菜谱」</p>
    </div>
    <div class="select-bar">
      <span id="ingCount">已选 0 种食材</span>
      <button class="link-btn" id="clearIng">清空</button>
    </div>
    <div id="ingCategories"></div>
    <button class="primary-btn big-btn sticky-bottom" id="genRecipes">✨ 生成菜谱</button>

    <div class="card" style="margin-top:16px">
      <h3>⏰ 我的食材 · 保质期</h3>
      <p class="hint">登记快到期的食材，推荐会优先用它们做菜</p>
      <div class="expiry-row">
        <input id="expName" type="text" placeholder="食材名，如：菠菜" maxlength="12">
        <input id="expDate" type="date">
        <button class="primary-btn" id="expAdd">登记</button>
      </div>
      <div id="expList"></div>
    </div>

    <div class="card">
      <h3>🚫 忌口档案</h3>
      <p class="hint">一次设置，推荐和筛选处处生效</p>
      <div class="diet-row" id="dietRow">
        <button class="diet-chip" data-d="nospicy">不吃辣</button>
        <button class="diet-chip" data-d="nocilantro">不吃香菜</button>
        <button class="diet-chip" data-d="kidmeal">儿童餐</button>
      </div>
    </div>
  </section>

  <!-- ===== 一周 ===== -->
  <section id="tab-week" class="tab-page">
    <div class="page-head">
      <h2>📅 一周菜单</h2>
      <p class="hint">为每天的三餐安排菜谱，每餐可加多道菜</p>
    </div>
    <div id="weekPlan"></div>
    <button class="primary-btn big-btn" id="genShopFromWeek">🧾 一键汇总：时间 + 采买清单</button>
    <div id="weekSummary"></div>
  </section>

  <!-- ===== 清单 ===== -->
  <section id="tab-shop" class="tab-page">
    <div class="page-head">
      <h2>📝 采买清单 <span class="count-badge" id="shopCount"></span></h2>
    </div>
    <div class="card">
      <div class="add-row">
        <input id="shopInput" type="text" placeholder="手动添加要买的东西…" maxlength="20">
        <button class="primary-btn" id="shopAdd">添加</button>
      </div>
      <ul id="shopList" class="check-list"></ul>
      <div style="display:flex;gap:8px;margin-top:8px">
        <button class="ghost-btn" id="downloadShop" style="flex:1">⬇️ 下载清单</button>
        <button class="ghost-btn" id="clearBought" style="flex:1">清空已买</button>
      </div>
    </div>
  </section>

  <!-- 菜谱详情（覆盖层） -->
  <div id="recipeDetail" class="detail-overlay hidden">
    <div class="detail-card" id="detailCard">
      <button class="close-btn" id="closeDetail">✕</button>
      <div id="detailContent"></div>
    </div>
  </div>

  <!-- ===== 助手 ===== -->
  <section id="tab-assistant" class="tab-page">
    <div class="page-head">
      <h2>🤖 厨房助手</h2>
      <p class="hint">问我"怎么做宫保鸡丁"或"我有番茄鸡蛋做什么好"</p>
    </div>
    <div class="avatar-picker">
      <span class="label">我的形象：</span>
      <div id="avatarChoices"></div>
    </div>
    <div id="chatBox" class="chat-box"></div>
    <div class="chat-input-row">
      <input id="chatInput" type="text" placeholder="问问我吧…" maxlength="100">
      <button class="primary-btn" id="chatSend">发送</button>
    </div>
  </section>

  <!-- ===== 我的 ===== -->
  <section id="tab-me" class="tab-page">
    <div class="page-head">
      <h2>🙋 我的</h2>
    </div>

    <div class="card">
      <h3>📸 晒成品</h3>
      <div class="form-row">
        <label>做了哪道菜</label>
        <select id="showRecipe"></select>
      </div>
      <div class="form-row">
        <label>打几分</label>
        <div class="stars" id="showStars">
          <span data-v="1">★</span><span data-v="2">★</span><span data-v="3">★</span><span data-v="4">★</span><span data-v="5">★</span>
        </div>
      </div>
      <div class="form-row">
        <label>心得</label>
        <textarea id="showNote" rows="2" placeholder="说说这次做得咋样…" maxlength="200"></textarea>
      </div>
      <button class="primary-btn big-btn" id="showSubmit">发布晒单</button>
    </div>

    <div class="card">
      <h3>🏆 成品展示墙</h3>
      <div id="showWall"></div>
    </div>

    <div class="card">
      <h3>🎁 我的积分 <span class="points-num" id="pointsNum">0</span></h3>
      <p class="hint">我的邀请码：<b id="inviteCode" class="code"></b>
        <button class="link-btn" id="copyCode">复制</button>
      </p>
      <button class="primary-btn big-btn" id="simInvite">👥 模拟好友接受邀请（+10分·演示）</button>
      <h4 class="sub-h">积分明细</h4>
      <ul id="pointsLog" class="log-list"></ul>
    </div>
  </section>

</main>

<nav class="bottom-nav">
  <button class="nav-btn active" data-tab="tab-home"><span class="nav-ico">🏠</span>灵感</button>
  <button class="nav-btn" data-tab="tab-ingredients"><span class="nav-ico">🧺</span>食材</button>
  <button class="nav-btn" data-tab="tab-week"><span class="nav-ico">📅</span>一周</button>
  <button class="nav-btn" data-tab="tab-shop"><span class="nav-ico">📝</span>清单</button>
  <button class="nav-btn" data-tab="tab-assistant"><span class="nav-ico">🤖</span>助手</button>
  <button class="nav-btn" data-tab="tab-me"><span class="nav-ico">🙋</span>我的</button>
</nav>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
